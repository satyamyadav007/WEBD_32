<!DOCTYPE html>
<html>
<head>
    <title>Books Table</title>
    <script src="script.js"></script>
</head>
<body>

<h2 style="text-align:center; color:crimson;">Books Table</h2>

<form>

<table border="1" style="width:80%; margin:auto; border-color:darkorange;">
    <tr>
        <th>Product Code</th>
        <th>Product Name</th>
        <th>Product Price</th>
        <th>Purchase</th>
        <th>Quantity</th>
    </tr>

    <tr>
        <td>001</td>
        <td>Biography of Prem Chand</td>
        <td id="price1">200</td>
        <td>
            <input type="checkbox" id="chk1" onchange="enableQty('chk1','qty1')">
        </td>
        <td>
            <input type="number" id="qty1" disabled>
        </td>
    </tr>

    <tr>
        <td>002</td>
        <td>Harry Potter</td>
        <td id="price2">1000</td>
        <td>
            <input type="checkbox" id="chk2" onchange="enableQty('chk2','qty2')">
        </td>
        <td>
            <input type="number" id="qty2" disabled>
        </td>
    </tr>

    <tr>
        <td>003</td>
        <td>Discovery of India</td>
        <td id="price3">500</td>
        <td>
            <input type="checkbox" id="chk3" onchange="enableQty('chk3','qty3')">
        </td>
        <td>
            <input type="number" id="qty3" disabled>
        </td>
    </tr>

    <tr>
        <td>004</td>
        <td>Alif Laila Story</td>
        <td id="price4">200</td>
        <td>
            <input type="checkbox" id="chk4" onchange="enableQty('chk4','qty4')">
        </td>
        <td>
            <input type="number" id="qty4" disabled>
        </td>
    </tr>

    <tr>
        <td>005</td>
        <td>Amitabh Bachchan</td>
        <td id="price5">1000</td>
        <td>
            <input type="checkbox" id="chk5" onchange="enableQty('chk5','qty5')">
        </td>
        <td>
            <input type="number" id="qty5" disabled>
        </td>
    </tr>

</table>

<br>

<div style="text-align:center;">
    <input type="button" value="Total Bill" onclick="totalBill()"
    style="background:green; color:white; padding:8px 20px; border:none;">

    <input type="reset" value="Reset"
    style="background:green; color:white; padding:8px 20px; border:none;">
</div>

</form>

</body>
</html>
